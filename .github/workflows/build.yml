name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure LLVM 23 package repository
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ca-certificates wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-23.list
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            clang-format-23 cppcheck \
            qt6-base-dev qt6-multimedia-dev libssl-dev libopus-dev \
            libspeexdsp-dev libxkbcommon-dev libeigen3-dev libhidapi-dev
      - name: Build
        run: make release
      - name: Verify formatting
        run: >-
          find src -path src/build -prune -o \( -name '*.cpp' -o -name '*.h' \) -print0 |
          xargs -0 clang-format-23 --dry-run --Werror
      - name: Static analysis
        run: |
          # Keep source correctness categories enabled. These filters cover
          # external include modeling limitations and analyzer status reports.
          cppcheck --error-exitcode=1 --enable=all --inconclusive --std=c++20 \
            --library=qt \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=checkersReport \
            --suppressions-list=.cppcheck-suppressions \
            -I src -i src/build src
      - name: Test
        run: ctest --test-dir src/build --output-on-failure

  macos:
    name: Apple Silicon macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install dependencies
        run: brew install cmake ninja pkg-config qt openssl@3 opus speexdsp eigen hidapi
      - name: Configure Homebrew tools
        run: echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make release
      - name: Test
        run: ctest --test-dir src/build --output-on-failure
      - name: Verify self-contained application bundle
        run: make bundle
