version: 2
updates:
  # Keep GitHub Actions up to date.
  # Convention: pin actions to a full commit SHA with NO trailing `# vX` version
  # comment — Dependabot bumps the SHA but doesn't keep such comments in sync.
  # The version remains visible in Dependabot's PR title.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
